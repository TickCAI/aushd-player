services:
  aushd-distribution:
    build: .
    container_name: aushd-distribution
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
      MAX_BODY_BYTES: 2097152
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
