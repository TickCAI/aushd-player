name: Build AusHD Player

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      skip_distribution:
        description: 'Build only (no DIST_URL needed); updater and hub stay disabled'
        type: boolean
        default: true
      test_release:
        description: '勾选用 v0.1 测试版号构建并发布 Release，跳过 DIST_URL 检查'
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  TEST_MODE: ${{ inputs.test_release == true }}
  BUILD_CHANNEL: ${{ inputs.test_release == true && 'beta' || 'stable' }}
  DIST_URL: ${{ secrets.DIST_URL }}
  HUB_URL: ${{ secrets.HUB_URL }}
  ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
  # Tag pushes always ship a configured client. Manual runs may opt into a
  # build-only package with the distribution layer switched off. Test-release
  # runs (workflow_dispatch + test_release) always skip the DIST_URL check:
  # they build on the beta channel, never contact the self-hosted updater, and
  # are published to GitHub Releases only.
  REQUIRE_DIST: ${{ (github.event_name == 'push' || inputs.skip_distribution == false) && !(github.event_name == 'workflow_dispatch' && inputs.test_release == true) }}

jobs:
  preflight:
    name: Validate distribution config
    runs-on: ubuntu-latest
    steps:
      - name: Check DIST_URL
        if: env.REQUIRE_DIST == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DIST_URL:-}" ]]; then
            echo "::error::Secret DIST_URL is missing. Set it to the public URL of your distribution service, or trigger this workflow manually with 'Build only' enabled."
            exit 1
          fi
          if [[ ! "$DIST_URL" =~ ^https://[^/]+ ]] && [[ ! "$DIST_URL" =~ ^http://[^/]+ ]]; then
            echo "::error::DIST_URL must be a full http(s) URL: $DIST_URL"
            exit 1
          fi
          host="${DIST_URL#*://}"; host="${host%%/*}"; host="${host%%:*}"
          case "$host" in
            example.com|*.example.com|example.org|*.example.org|example.net|*.example.net|*.invalid|localhost|127.0.0.1)
              echo "::error::DIST_URL points at a placeholder or loopback host ($host). Use a publicly reachable address."
              exit 1 ;;
          esac
          echo "Distribution URL accepted: $DIST_URL"
      - name: Build-only mode
        if: env.REQUIRE_DIST != 'true'
        shell: bash
        run: |
          echo "Build-only / test-release mode"
          echo "AUSHD_DIST_URL and AUSHD_HUB_URL are empty; updater and hub stay disabled"
          if [[ "${TEST_MODE:-false}" == "true" ]]; then
            echo "Test-release mode: tag=$TAG channel=$BUILD_CHANNEL - beta channel, no self-hosted updater, no distribution registration, GitHub Release only"
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: ubuntu-latest
            platform: androidtv
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        shell: bash
        run: flutter --version

      - name: Resolve dependencies
        shell: bash
        run: flutter pub get

      - name: Validate localizations
        shell: bash
        run: flutter gen-l10n

      - name: Inject distribution config
        shell: bash
        run: |
          if [[ "$REQUIRE_DIST" == "true" ]]; then
            echo "AUSHD_DIST_URL=$DIST_URL" >> "$GITHUB_ENV"
            echo "AUSHD_HUB_URL=$HUB_URL" >> "$GITHUB_ENV"
          else
            echo "AUSHD_DIST_URL=" >> "$GITHUB_ENV"
            echo "AUSHD_HUB_URL=" >> "$GITHUB_ENV"
          fi

      # ---------------- Windows ----------------
      - name: Fetch libmpv (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p windows/libs
          url=$(curl -sf https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest | \
            python -c "import json,sys,re; print(next(a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if re.match(r'mpv-dev-x86_64-\d', a['name'])))")
          echo "libmpv source: $url"
          curl -sfL -o mpv-dev.7z "$url"
          7z e -y -ompv-dev mpv-dev.7z '*.dll'
          mv mpv-dev/libmpv-2.dll windows/libs/libmpv-2.dll
          ls -lh windows/libs

      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          V="${TAG#v}"
          flutter build windows --release \
            --build-name="$V" --build-number=1 \
            --dart-define=AUSHD_DIST_URL="$AUSHD_DIST_URL" \
            --dart-define=AUSHD_HUB_URL="$AUSHD_HUB_URL" \
            --dart-define=AUSHD_CHANNEL=${{ env.BUILD_CHANNEL }}

      - name: Package Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "installer\zerk_play.iss"

      - name: Collect Windows artifact
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          V="${TAG#v}"
          mkdir -p dist
          cp build/installer/*.exe "dist/AusHD-Player-${V}-Windows-setup.exe"
          ls -lh dist

      # ---------------- Linux ----------------
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev libsecret-1-dev libjsoncpp-dev

      - name: Build and package Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          V="${TAG#v}"
          flutter build linux --release \
            --build-name="$V" --build-number=1 \
            --dart-define=AUSHD_DIST_URL="$AUSHD_DIST_URL" \
            --dart-define=AUSHD_HUB_URL="$AUSHD_HUB_URL" \
            --dart-define=AUSHD_CHANNEL=${{ env.BUILD_CHANNEL }}
          SKIP_BUILD=1 VERSION="$V" bash linux/packaging/make-tarball.sh
          mkdir -p dist
          cp build/linux/package/*.tar.gz "dist/AusHD-Player-${V}-Linux-x64.tar.gz"
          ls -lh dist

      # ---------------- Android TV ----------------
      - uses: actions/setup-java@v4
        if: matrix.platform == 'androidtv'
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android TV APK
        if: matrix.platform == 'androidtv'
        shell: bash
        run: |
          V="${TAG#v}"
          flutter build apk --release \
            --build-name="$V" --build-number=1 \
            --dart-define=PLAY_STORE=false \
            --dart-define=AUSHD_DIST_URL="$AUSHD_DIST_URL" \
            --dart-define=AUSHD_HUB_URL="$AUSHD_HUB_URL" \
            --dart-define=AUSHD_CHANNEL=${{ env.BUILD_CHANNEL }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/AusHD-Player-${V}-AndroidTV.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: AusHD Player ${{ env.TAG }}${{ inputs.test_release == true && ' 测试版' || '' }}
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Register artifacts with distribution service
        if: env.DIST_URL != '' && env.ADMIN_TOKEN != '' && env.TEST_MODE != 'true'
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          V="${TAG#v}"
          shopt -s nullglob
          for f in artifacts/*; do
            case "$f" in
              *.exe)    platform=windows ;;
              *.apk)    platform=androidtv ;;
              *.tar.gz) platform=linux ;;
              *)        echo "skip $f"; continue ;;
            esac
            echo "registering $f for $platform"
            node server/scripts/publish.js \
              --tag "$TAG" \
              --platform "$platform" \
              --file "$f" \
              --name "AusHD Player $V" \
              --version "$V" \
              --notes "Built by GitHub Actions for $TAG"
          done
